name: google_maps_flutter_ios_sdk11
description: iOS implementation of google_maps_flutter using Maps SDK 11.3 via SPM, aligned with google_navigation_flutter.
version: 2.19.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

flutter:
  plugin:
    implements: google_maps_flutter
    platforms:
      ios:
        pluginClass: GoogleMapsPlugin
        dartPluginClass: GoogleMapsFlutterIOS

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter_platform_interface: ^2.17.0
  meta: ^1.10.0
  stream_transform: ^2.0.0
